[package]
name = "wyneai"
version = "0.1.0"
description = "WyneAI desktop agent for FrameFX"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
dunce = "1"
open = "5"
wait-timeout = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
