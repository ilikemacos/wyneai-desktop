[package]
name = "wyneai"
version = "0.3.1"
description = "LarkquillAI desktop agent"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
dunce = "1"
open = "5"
wait-timeout = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# zip 4.x was yanked on crates.io; tauri-plugin-updater (Windows) still needs ^4, so pin it from the upstream tag.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
